services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - supermario_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    image: ${IMAGE_REPO_APP}:${TAG}
    environment:
      # IMPORTANT: inside compose network Postgres is always on 5432
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      PORT: "8000"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${FLASK_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  web:
    image: ${IMAGE_REPO_WEB}:${TAG}
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8082}:80"
    volumes:
      - ./content/images:/usr/share/nginx/html/images:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 30

volumes:
  supermario_db_data:
    name: supermario_db_data
    external: true
