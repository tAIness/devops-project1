# yamllint disable rule:line-length rule:indentation
---
name: Release_AWS

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy target (ec2=docker compose on EC2)"
        type: choice
        options: [ ec2 ]
        default: ec2
      runner:
        description: "Where to run build/push jobs (github=ubuntu-latest, ec2=self-hosted runner)"
        type: choice
        options: [ github, ec2 ]
        default: ec2

permissions:
  contents: write
  packages: write
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ECR_REGISTRY: ${{ vars.AWS_ECR_REGISTRY }}
  AWS_ECR_REPO_APP: ${{ vars.AWS_ECR_REPO_APP }}
  AWS_ECR_REPO_WEB: ${{ vars.AWS_ECR_REPO_WEB }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-target:
    name: Resolve deploy target
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.out.outputs.target }}
    steps:
      - id: out
        shell: bash
        run: |
          in="${{ inputs.target }}"
          var="${{ vars.DEPLOY_TARGET }}"
          tgt="${in:-${var:-ec2}}"
          echo "target=$tgt" >> "$GITHUB_OUTPUT"
          echo "Deploy target resolved to: $tgt"

  resolve-runner:
    name: Resolve runner (github/ec2)
    runs-on: ubuntu-latest
    outputs:
      runs_on_json: ${{ steps.out.outputs.runs_on_json }}
      runner_choice: ${{ steps.out.outputs.runner_choice }}
    steps:
      - id: out
        shell: bash
        run: |
          choice="${{ inputs.runner }}"
          if [[ -z "$choice" ]]; then choice="ec2"; fi

          if [[ "$choice" == "ec2" ]]; then
            echo 'runs_on_json=["self-hosted","ec2"]' >> "$GITHUB_OUTPUT"
          else
            echo 'runs_on_json=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          fi
          echo "runner_choice=$choice" >> "$GITHUB_OUTPUT"
          echo "Runner resolved to: $choice"

  compute-tag:
    name: Compute next tag (when pushing to main)
    runs-on: ubuntu-latest
    if: ${{ github.ref_type == 'branch' && github.ref_name == 'main' }}
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Compute next tag (no create)
        id: bump
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          last="$(git tag -l 'v*.*.*' | sort -V | tail -n1 || true)"
          if [[ -z "$last" ]]; then
            major=1 minor=0 patch=1
          else
            IFS=. read -r vM vN vP <<<"${last#v}"
            major="$vM"; minor="$vN"; patch="$vP"
            patch=$((10#$patch + 1))
          fi
          echo "tag=v${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"

  setup:
    name: Resolve image tag
    runs-on: ubuntu-latest
    needs: [compute-tag]
    outputs:
      IMAGE_TAG: ${{ steps.resolve.outputs.IMAGE_TAG }}
    steps:
      - id: resolve
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "IMAGE_TAG=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "IMAGE_TAG=${{ needs.compute-tag.outputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

  build-and-push-app:
    name: Build & push app image (ECR)
    runs-on: ${{ fromJSON(needs.resolve-runner.outputs.runs_on_json) }}
    needs: [setup, resolve-runner]
    env:
      IMAGE_TAG: ${{ needs.setup.outputs.IMAGE_TAG }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials (OIDC role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: docker/setup-buildx-action@v3
      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region "${AWS_REGION}" \
            | docker login --username AWS --password-stdin "${AWS_ECR_REGISTRY}"
      - name: Build & push app to ECR
        uses: docker/build-push-action@v6
        with:
          context: ./app
          platforms: linux/amd64
          push: true
          tags: |
            ${{ vars.AWS_ECR_REGISTRY }}/${{ vars.AWS_ECR_REPO_APP }}:${{ env.IMAGE_TAG }}
            ${{ vars.AWS_ECR_REGISTRY }}/${{ vars.AWS_ECR_REPO_APP }}:latest

  build-and-push-web:
    name: Build & push web image (ECR)
    runs-on: ${{ fromJSON(needs.resolve-runner.outputs.runs_on_json) }}
    needs: [setup, resolve-runner]
    env:
      IMAGE_TAG: ${{ needs.setup.outputs.IMAGE_TAG }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials (OIDC role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: docker/setup-buildx-action@v3
      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region "${AWS_REGION}" \
            | docker login --username AWS --password-stdin "${AWS_ECR_REGISTRY}"
      - name: Build & push web to ECR
        uses: docker/build-push-action@v6
        with:
          context: ./web
          platforms: linux/amd64
          push: true
          tags: |
            ${{ vars.AWS_ECR_REGISTRY }}/${{ vars.AWS_ECR_REPO_WEB }}:${{ env.IMAGE_TAG }}
            ${{ vars.AWS_ECR_REGISTRY }}/${{ vars.AWS_ECR_REPO_WEB }}:latest

  deploy-ec2:
    name: Deploy to EC2 (Docker Compose from ECR)
    runs-on: [self-hosted, ec2]
    needs: [resolve-target, setup, build-and-push-app, build-and-push-web]
    if: ${{ needs.resolve-target.outputs.target == 'ec2' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
    env:
      TAG: ${{ needs.setup.outputs.IMAGE_TAG }}
      APP_IMAGE: ${{ vars.AWS_ECR_REGISTRY }}/${{ vars.AWS_ECR_REPO_APP }}
      WEB_IMAGE: ${{ vars.AWS_ECR_REGISTRY }}/${{ vars.AWS_ECR_REPO_WEB }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        shell: bash
        run: |
          aws ecr get-login-password --region "${AWS_REGION}" \
            | docker login --username AWS --password-stdin "${AWS_ECR_REGISTRY}"

      - name: Deploy with docker compose (pull from ECR)
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /srv/supermario
          sudo cp -f deploy/compose.yml /srv/supermario/compose.yml

          sudo tee /srv/supermario/.env >/dev/null <<EOF
          APP_IMAGE=${APP_IMAGE}
          WEB_IMAGE=${WEB_IMAGE}
          TAG=${TAG}
          DB_NAME=${{ vars.DB_NAME }}
          DB_USER=${{ vars.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_PORT=${{ vars.DB_PORT || '5432' }}
          FLASK_PORT=${{ vars.FLASK_PORT || '8000' }}
          WEB_PORT=${{ vars.WEB_PORT || '8082' }}
          EOF

          cd /srv/supermario
          sudo docker pull "${APP_IMAGE}:${TAG}"
          sudo docker pull "${WEB_IMAGE}:${TAG}"
          sudo docker volume create supermario_db_data >/dev/null 2>&1 || true
          sudo docker compose --env-file .env -f compose.yml up -d --no-build
          sudo docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'

      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          curl -sf "http://127.0.0.1:${{ vars.FLASK_PORT || '8000' }}/health" >/dev/null
          curl -sI "http://127.0.0.1:${{ vars.WEB_PORT || '8082' }}" | grep -q "200 OK"

  notify-slack:
    name: notify-slack / send
    if: ${{ always() }}
    needs:
      - setup
      - resolve-runner
      - build-and-push-app
      - build-and-push-web
      - deploy-ec2
    uses: tAIness/devops-ci-lib/.github/workflows/slack-notify.yml@main
    secrets: inherit
    with:
      title: "Release_AWS: ${{ needs.setup.outputs.IMAGE_TAG || github.ref_name }}"
      status: ${{ (needs['build-and-push-app'].result == 'failure' || needs['build-and-push-web'].result == 'failure' || needs['deploy-ec2'].result == 'failure') && 'failure' || 'success' }}
      message: "runner=${{ needs.resolve-runner.outputs.runner_choice }} · target=ec2 · tag=${{ needs.setup.outputs.IMAGE_TAG || github.ref_name }}"
      only_on: "always"
      run_url: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
