# yamllint disable rule:line-length rule:indentation
---
name: Release_AWS

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      build_runner:
        description: "Where to run the build jobs"
        type: choice
        options: [ github, ec2 ]
        default: github
      deploy:
        description: "Run deploy step"
        type: boolean
        default: true

permissions:
  contents: write
  packages: write
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ECR_REGISTRY: ${{ vars.AWS_ECR_REGISTRY }}
  AWS_ECR_REPO_APP: ${{ vars.AWS_ECR_REPO_APP }}
  AWS_ECR_REPO_WEB: ${{ vars.AWS_ECR_REPO_WEB }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-runner:
    name: Resolve runner (github/ec2)
    runs-on: ubuntu-latest
    outputs:
      build_runs_on: ${{ steps.out.outputs.build_runs_on }}
    steps:
      - id: out
        shell: bash
        run: |
          set -euo pipefail
          req="${{ inputs.build_runner }}"
          req="${req:-github}"

          if [[ "$req" == "ec2" ]]; then
            echo 'build_runs_on=["self-hosted","ec2"]' >> "$GITHUB_OUTPUT"
          else
            echo 'build_runs_on=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          fi

  compute-tag:
    name: Compute tag (branch main -> next tag, tag event -> use tag)
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute tag
        id: bump
        shell: bash
        run: |
          set -euo pipefail

          REF_TYPE="${{ github.ref_type }}"
          REF_NAME="${{ github.ref_name }}"

          if [[ "$REF_TYPE" == "tag" ]]; then
            echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --tags --force
          last="$(git tag -l 'v*.*.*' | sort -V | tail -n1 || true)"

          if [[ -z "$last" ]]; then
            major=1 minor=0 patch=1
          else
            IFS=. read -r vM vN vP <<<"${last#v}"
            major="$vM"; minor="$vN"; patch="$vP"
            patch=$((10#$patch + 1))
          fi

          echo "tag=v${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"

  setup:
    name: Resolve image tag
    runs-on: ubuntu-latest
    needs: [compute-tag]
    outputs:
      IMAGE_TAG: ${{ steps.resolve.outputs.IMAGE_TAG }}
    steps:
      - id: resolve
        shell: bash
        run: |
          set -euo pipefail
          echo "IMAGE_TAG=${{ needs.compute-tag.outputs.tag }}" >> "$GITHUB_OUTPUT"

  bump-helm-appversion:
    name: Bump Helm appVersion in all charts & push (main only; no-op on tags)
    runs-on: ubuntu-latest
    needs: [compute-tag]
    env:
      TAG: ${{ needs.compute-tag.outputs.tag }}
    steps:
      - name: Skip unless main branch push
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.ref_type }}" != "branch" || "${{ github.ref_name }}" != "main" ]]; then
            echo "Not a main branch push; skipping helm bump."
            exit 0
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install yq (static)
        run: |
          set -euo pipefail
          YQ_VERSION=v4.44.3
          OS=$(uname); ARCH=$(uname -m)
          case "$ARCH" in
            x86_64) ARCH=amd64 ;;
            aarch64|arm64) ARCH=arm64 ;;
          esac
          curl -fsSL -o /usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_${OS}_${ARCH}"
          chmod +x /usr/local/bin/yq

      - name: Update appVersion for ALL charts + write releaseTag
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t charts < <(git ls-files 'infra/helm/**/Chart.yaml')
          (( ${#charts[@]} )) || { echo "No Chart.yaml under infra/helm"; exit 1; }
          for f in "${charts[@]}"; do
            yq -i '.appVersion = env(TAG)' "$f"
          done
          yq -i '.global.releaseTag = env(TAG)' infra/helm/argocd-apps/values.yaml

      - name: Commit & push change
        run: |
          set -euo pipefail
          git config user.name  "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes to commit."
          else
            git add infra/helm/**/Chart.yaml infra/helm/argocd-apps/values.yaml
            git commit -m "chore(helm): set appVersion & releaseTag ${TAG}"
            git push origin HEAD:main
          fi

  create-tag:
    name: Create & push git tag (main only; no-op on tag runs)
    runs-on: ubuntu-latest
    needs: [compute-tag, bump-helm-appversion]
    env:
      TAG: ${{ needs.compute-tag.outputs.tag }}
    steps:
      - name: Skip unless main branch push
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.ref_type }}" != "branch" || "${{ github.ref_name }}" != "main" ]]; then
            echo "Not a main branch push; skipping tag create."
            exit 0
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name  "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

      - name: Tag & push
        shell: bash
        run: |
          set -euo pipefail
          git fetch --all --tags
          git checkout main
          git pull --ff-only
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; skipping create."
          else
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

  build-and-push-app:
    name: Build & push app image (ECR)
    runs-on: ${{ fromJSON(needs.resolve-runner.outputs.build_runs_on) }}
    needs: [resolve-runner, setup]
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR
        shell: bash
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "${AWS_REGION}" \
            | docker login --username AWS --password-stdin "${AWS_ECR_REGISTRY}"

      - name: Build & push app to ECR
        uses: docker/build-push-action@v6
        with:
          context: ./app
          platforms: linux/amd64
          push: true
          tags: |
            ${{ vars.AWS_ECR_REGISTRY }}/${{ vars.AWS_ECR_REPO_APP }}:${{ needs.setup.outputs.IMAGE_TAG }}
            ${{ vars.AWS_ECR_REGISTRY }}/${{ vars.AWS_ECR_REPO_APP }}:latest

  build-and-push-web:
    name: Build & push web image (ECR)
    runs-on: ${{ fromJSON(needs.resolve-runner.outputs.build_runs_on) }}
    needs: [resolve-runner, setup]
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR
        shell: bash
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "${AWS_REGION}" \
            | docker login --username AWS --password-stdin "${AWS_ECR_REGISTRY}"

      - name: Build & push web to ECR
        uses: docker/build-push-action@v6
        with:
          context: ./web
          platforms: linux/amd64
          push: true
          tags: |
            ${{ vars.AWS_ECR_REGISTRY }}/${{ vars.AWS_ECR_REPO_WEB }}:${{ needs.setup.outputs.IMAGE_TAG }}
            ${{ vars.AWS_ECR_REGISTRY }}/${{ vars.AWS_ECR_REPO_WEB }}:latest

  deploy-ec2:
    name: Deploy to EC2 (Docker Compose from ECR) - SELF HOSTED
    runs-on: [self-hosted, ec2]
    needs: [setup, build-and-push-app, build-and-push-web, create-tag]
    if: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && (github.event_name != 'workflow_dispatch' || inputs.deploy == true) }}
    env:
      TAG: ${{ needs.setup.outputs.IMAGE_TAG }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ECR_REGISTRY: ${{ vars.AWS_ECR_REGISTRY }}

      IMAGE_REPO_APP: ${{ vars.AWS_ECR_REGISTRY }}/${{ vars.AWS_ECR_REPO_APP }}
      IMAGE_REPO_WEB: ${{ vars.AWS_ECR_REGISTRY }}/${{ vars.AWS_ECR_REPO_WEB }}

      DB_NAME: ${{ vars.DB_NAME }}
      DB_USER: ${{ vars.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_PORT: ${{ vars.DB_PORT }}
      FLASK_PORT: ${{ vars.FLASK_PORT }}
      WEB_PORT: ${{ vars.WEB_PORT }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to ECR
        shell: bash
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "${AWS_REGION}" \
            | docker login --username AWS --password-stdin "${AWS_ECR_REGISTRY}"

      - name: Ensure Docker Compose v2 (install in $HOME if missing)
        shell: bash
        run: |
          set -euo pipefail

          if docker compose version >/dev/null 2>&1; then
            docker compose version
            exit 0
          fi

          mkdir -p "$HOME/.docker/cli-plugins"

          ARCH="$(uname -m)"
          case "$ARCH" in
            x86_64|amd64) BIN="docker-compose-linux-x86_64" ;;
            aarch64|arm64) BIN="docker-compose-linux-aarch64" ;;
            *) echo "Unsupported arch: $ARCH"; exit 1 ;;
          esac

          VER="v2.27.0"
          curl -fsSL "https://github.com/docker/compose/releases/download/${VER}/${BIN}" \
            -o "$HOME/.docker/cli-plugins/docker-compose"
          chmod +x "$HOME/.docker/cli-plugins/docker-compose"

          docker compose version

      - name: Write .env for compose (compose auto-loads .env)
        shell: bash
        run: |
          set -euo pipefail
          BASE_DIR="$HOME/supermario"
          mkdir -p "$BASE_DIR"

          DBP="${DB_PORT:-5432}"
          APIP="${FLASK_PORT:-8000}"
          WEBP="${WEB_PORT:-8082}"

          cat > "$BASE_DIR/.env" <<EOF
          IMAGE_REPO_APP=${IMAGE_REPO_APP}
          IMAGE_REPO_WEB=${IMAGE_REPO_WEB}
          TAG=${TAG}

          DB_NAME=${DB_NAME}
          DB_USER=${DB_USER}
          DB_PASSWORD=${DB_PASSWORD}
          DB_PORT=${DBP}

          FLASK_PORT=${APIP}
          WEB_PORT=${WEBP}
          EOF

          chmod 600 "$BASE_DIR/.env"
          echo "Wrote $BASE_DIR/.env"

      - name: Copy compose + content/images so web volume mount exists
        shell: bash
        run: |
          set -euo pipefail
          BASE_DIR="$HOME/supermario"
          mkdir -p "$BASE_DIR"
          cp -f deploy/compose.yml "$BASE_DIR/compose.yml"

          mkdir -p "$BASE_DIR/content"
          if [[ -d "deploy/content/images" ]]; then
            rsync -a --delete "deploy/content/images/" "$BASE_DIR/content/images/"
          elif [[ -d "content/images" ]]; then
            rsync -a --delete "content/images/" "$BASE_DIR/content/images/"
          else
            echo "WARNING: no deploy/content/images or content/images found in repo. Creating empty dir."
            mkdir -p "$BASE_DIR/content/images"
          fi

      - name: Deploy with docker compose
        shell: bash
        run: |
          set -euo pipefail
          BASE_DIR="$HOME/supermario"
          cd "$BASE_DIR"

          docker pull "${IMAGE_REPO_APP}:${TAG}"
          docker pull "${IMAGE_REPO_WEB}:${TAG}"

          docker volume create supermario_db_data >/dev/null 2>&1 || true

          docker compose -f compose.yml up -d --no-build

          docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'

      - name: Smoke test (retries)
        shell: bash
        run: |
          set -euo pipefail

          BASE_DIR="$HOME/supermario"
          APIP="${FLASK_PORT:-8000}"

          echo "Waiting for app health on http://127.0.0.1:${APIP}/health ..."
          ok=0
          for i in {1..25}; do
            if curl -sf "http://127.0.0.1:${APIP}/health" >/dev/null; then
              ok=1
              break
            fi
            echo "Attempt $i/25 failed; sleeping 2s..."
            sleep 2
          done

          if [[ "$ok" -ne 1 ]]; then
            echo "App health failed after retries. Dumping logs:"
            docker compose -f "$BASE_DIR/compose.yml" logs --no-color --tail=300 app || true
            docker compose -f "$BASE_DIR/compose.yml" logs --no-color --tail=300 db || true
            exit 1
          fi

          echo "Waiting for web on http://127.0.0.1:80 ..."
          ok=0
          for i in {1..25}; do
            code="$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:80" || true)"
            if [[ "$code" == "200" || "$code" == "301" || "$code" == "302" ]]; then
              ok=1
              break
            fi
            echo "Attempt $i/25 got HTTP $code; sleeping 2s..."
            sleep 2
          done

          if [[ "$ok" -ne 1 ]]; then
            echo "Web check failed after retries. Dumping logs:"
            docker compose -f "$BASE_DIR/compose.yml" logs --no-color --tail=300 web || true
            exit 1
          fi

          echo "Smoke test passed."

  notify-slack:
    name: notify-slack / send
    if: ${{ always() }}
    needs:
      - setup
      - build-and-push-app
      - build-and-push-web
      - deploy-ec2
    uses: tAIness/devops-ci-lib/.github/workflows/slack-notify.yml@main
    secrets: inherit
    with:
      title: "Release_AWS: ${{ needs.setup.outputs.IMAGE_TAG || github.ref_name }}"
      status: ${{ (needs['build-and-push-app'].result == 'failure' || needs['build-and-push-web'].result == 'failure' || needs['deploy-ec2'].result == 'failure') && 'failure' || 'success' }}
      message: "deploy=ec2 · tag=${{ needs.setup.outputs.IMAGE_TAG || github.ref_name }}"
      only_on: "always"
      run_url: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
