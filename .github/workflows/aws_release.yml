# yamllint disable rule:line-length rule:indentation
---
name: Release_AWS

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      runner:
        description: "Where to run the workflow jobs"
        type: choice
        options: [github, ec2]
        default: ec2
      deploy_target:
        description: "Deploy target (for this assignment we deploy on EC2 docker-compose)"
        type: choice
        options: [ec2]
        default: ec2

permissions:
  contents: write
  packages: write
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ECR_REGISTRY: ${{ vars.AWS_ECR_REGISTRY }}
  AWS_ECR_REPO_APP: ${{ vars.AWS_ECR_REPO_APP }}
  AWS_ECR_REPO_WEB: ${{ vars.AWS_ECR_REPO_WEB }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------
  # Resolve runner + deploy target (inputs > vars > defaults)
  # ------------------------------------------------------------
  resolve:
    name: Resolve runner & deploy target
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.out.outputs.runner }}
      deploy_target: ${{ steps.out.outputs.deploy_target }}
    steps:
      - id: out
        shell: bash
        run: |
          set -euo pipefail

          in_runner="${{ inputs.runner }}"
          var_runner="${{ vars.RELEASE_RUNNER }}"
          runner="${in_runner:-${var_runner:-ec2}}"

          in_target="${{ inputs.deploy_target }}"
          var_target="${{ vars.DEPLOY_TARGET }}"
          deploy_target="${in_target:-${var_target:-ec2}}"

          echo "runner=$runner" >> "$GITHUB_OUTPUT"
          echo "deploy_target=$deploy_target" >> "$GITHUB_OUTPUT"

          echo "Resolved runner=$runner"
          echo "Resolved deploy_target=$deploy_target"

  # ------------------------------------------------------------
  # Compute next tag on main branch pushes (if not pushing a tag)
  # ------------------------------------------------------------
  compute-tag:
    name: Compute next tag (when pushing to main)
    runs-on: ubuntu-latest
    if: ${{ github.ref_type == 'branch' && github.ref_name == 'main' }}
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Compute next semver tag (patch bump)
        id: bump
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force

          last="$(git tag -l 'v*.*.*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)"
          if [[ -z "$last" ]]; then
            major=1 minor=0 patch=1
          else
            IFS=. read -r vM vN vP <<<"${last#v}"
            major="$vM"; minor="$vN"; patch="$vP"
            patch=$((10#$patch + 1))
          fi

          echo "tag=v${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"
          echo "Next tag: v${major}.${minor}.${patch}"

  # ------------------------------------------------------------
  # Resolve IMAGE_TAG: pushed tag or computed tag
  # ------------------------------------------------------------
  setup:
    name: Resolve image tag
    runs-on: ubuntu-latest
    needs: [compute-tag]
    outputs:
      IMAGE_TAG: ${{ steps.resolve.outputs.IMAGE_TAG }}
    steps:
      - id: resolve
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "IMAGE_TAG=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "Using pushed tag: ${{ github.ref_name }}"
          else
            echo "IMAGE_TAG=${{ needs.compute-tag.outputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "Using computed tag: ${{ needs.compute-tag.outputs.tag }}"
          fi

  # ------------------------------------------------------------
  # Optional: Create tag on main pushes (branch builds)
  # ------------------------------------------------------------
  create-tag:
    name: Create & push git tag (main pushes)
    runs-on: ubuntu-latest
    needs: [compute-tag]
    if: ${{ github.ref_type == 'branch' && github.ref_name == 'main' }}
    env:
      TAG: ${{ needs.compute-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Configure git identity
        run: |
          git config user.name  "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
      - name: Tag & push
        shell: bash
        run: |
          set -euo pipefail
          git fetch --all --tags
          git checkout main
          git pull --ff-only
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; skipping."
          else
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

  # ------------------------------------------------------------
  # Build & push APP image (ECR)
  # Runner selectable: GitHub-hosted or EC2 self-hosted
  # ------------------------------------------------------------
  build-and-push-app:
    name: Build & push app image (ECR)
    needs: [resolve, setup]
    runs-on: ${{ needs.resolve.outputs.runner == 'ec2' && fromJSON('["self-hosted","ec2"]') || 'ubuntu-latest' }}
    env:
      IMAGE_TAG: ${{ needs.setup.outputs.IMAGE_TAG }}
    steps:
      - uses: actions/checkout@v4

      - name: Show runner evidence (for assignment)
        shell: bash
        run: |
          echo "RUNNER_NAME=$RUNNER_NAME"
          echo "RUNNER_OS=$RUNNER_OS"
          echo "RUNNER_ARCH=$RUNNER_ARCH"
          echo "RUNNER_LABELS=$RUNNER_LABELS"
          uname -a || true
          curl -s http://169.254.169.254/latest/meta-data/instance-id || true

      - name: Configure AWS credentials (OIDC role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR
        shell: bash
        run: |
          aws ecr get-login-password --region "${AWS_REGION}" \
            | docker login --username AWS --password-stdin "${AWS_ECR_REGISTRY}"

      - name: Build & push app to ECR
        uses: docker/build-push-action@v6
        with:
          context: ./app
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.AWS_ECR_REGISTRY }}/${{ env.AWS_ECR_REPO_APP }}:${{ env.IMAGE_TAG }}
            ${{ env.AWS_ECR_REGISTRY }}/${{ env.AWS_ECR_REPO_APP }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------------------
  # Build & push WEB image (ECR)
  # Runner selectable: GitHub-hosted or EC2 self-hosted
  # ------------------------------------------------------------
  build-and-push-web:
    name: Build & push web image (ECR)
    needs: [resolve, setup]
    runs-on: ${{ needs.resolve.outputs.runner == 'ec2' && fromJSON('["self-hosted","ec2"]') || 'ubuntu-latest' }}
    env:
      IMAGE_TAG: ${{ needs.setup.outputs.IMAGE_TAG }}
    steps:
      - uses: actions/checkout@v4

      - name: Show runner evidence (for assignment)
        shell: bash
        run: |
          echo "RUNNER_NAME=$RUNNER_NAME"
          echo "RUNNER_OS=$RUNNER_OS"
          echo "RUNNER_ARCH=$RUNNER_ARCH"
          echo "RUNNER_LABELS=$RUNNER_LABELS"
          uname -a || true
          curl -s http://169.254.169.254/latest/meta-data/instance-id || true

      - name: Configure AWS credentials (OIDC role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR
        shell: bash
        run: |
          aws ecr get-login-password --region "${AWS_REGION}" \
            | docker login --username AWS --password-stdin "${AWS_ECR_REGISTRY}"

      - name: Build & push web to ECR
        uses: docker/build-push-action@v6
        with:
          context: ./web
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.AWS_ECR_REGISTRY }}/${{ env.AWS_ECR_REPO_WEB }}:${{ env.IMAGE_TAG }}
            ${{ env.AWS_ECR_REGISTRY }}/${{ env.AWS_ECR_REPO_WEB }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------------------
  # Deploy on EC2 with Docker Compose (must run on EC2 runner)
  # ------------------------------------------------------------
  deploy-ec2:
    name: Deploy to EC2 (Docker Compose from ECR)
    needs: [resolve, setup, build-and-push-app, build-and-push-web, create-tag]
    runs-on: [self-hosted, ec2]
    if: ${{ needs.resolve.outputs.deploy_target == 'ec2' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
    env:
      TAG: ${{ needs.setup.outputs.IMAGE_TAG }}
      APP_IMAGE: ${{ vars.AWS_ECR_REGISTRY }}/${{ vars.AWS_ECR_REPO_APP }}
      WEB_IMAGE: ${{ vars.AWS_ECR_REGISTRY }}/${{ vars.AWS_ECR_REPO_WEB }}
    steps:
      - uses: actions/checkout@v4

      - name: Show runner evidence (for assignment)
        shell: bash
        run: |
          echo "RUNNER_NAME=$RUNNER_NAME"
          echo "RUNNER_LABELS=$RUNNER_LABELS"
          echo "Instance ID (should work on EC2):"
          curl -s http://169.254.169.254/latest/meta-data/instance-id || true

      - name: Configure AWS credentials (OIDC role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        shell: bash
        run: |
          aws ecr get-login-password --region "${AWS_REGION}" \
            | docker login --username AWS --password-stdin "${AWS_ECR_REGISTRY}"

      - name: Prepare /srv/supermario (env + compose)
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /srv/supermario
          sudo chown -R "$(id -u):$(id -g)" /srv/supermario

          cp -f deploy/compose.yml /srv/supermario/compose.yml

          cat > /srv/supermario/.env <<EOF
          APP_IMAGE=${APP_IMAGE}
          WEB_IMAGE=${WEB_IMAGE}
          TAG=${TAG}
          DB_NAME=${{ vars.DB_NAME }}
          DB_USER=${{ vars.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_PORT=${{ vars.DB_PORT || '5432' }}
          FLASK_PORT=${{ vars.FLASK_PORT || '8000' }}
          WEB_PORT=${{ vars.WEB_PORT || '8082' }}
          EOF

          echo "Wrote /srv/supermario/.env"

      - name: Deploy with docker compose (pull from ECR)
        shell: bash
        run: |
          set -euo pipefail
          cd /srv/supermario

          docker pull "${APP_IMAGE}:${TAG}"
          docker pull "${WEB_IMAGE}:${TAG}"

          docker volume create supermario_db_data >/dev/null 2>&1 || true

          docker compose --env-file .env -f compose.yml up -d --no-build
          docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'

      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          FLASK_PORT="${{ vars.FLASK_PORT || '8000' }}"
          WEB_PORT="${{ vars.WEB_PORT || '8082' }}"

          curl -sf "http://127.0.0.1:${FLASK_PORT}/health" || (docker logs app || true; exit 1)
          curl -sI "http://127.0.0.1:${WEB_PORT}" | grep -q "200 OK"
          echo "Smoke tests OK."

  # ------------------------------------------------------------
  # Slack notification (always)
  # ------------------------------------------------------------
  notify-slack:
    name: notify-slack / send
    if: ${{ always() }}
    needs:
      - resolve
      - setup
      - build-and-push-app
      - build-and-push-web
      - deploy-ec2
    uses: tAIness/devops-ci-lib/.github/workflows/slack-notify.yml@main
    secrets: inherit
    with:
      title: "Release_AWS: ${{ needs.setup.outputs.IMAGE_TAG || github.ref_name }}"
      status: ${{ (needs['build-and-push-app'].result == 'failure' || needs['build-and-push-web'].result == 'failure' || needs['deploy-ec2'].result == 'failure') && 'failure' || 'success' }}
      message: "runner=${{ needs.resolve.outputs.runner }} · target=${{ needs.resolve.outputs.deploy_target }} · tag=${{ needs.setup.outputs.IMAGE_TAG || github.ref_name }}"
      only_on: "always"
      run_url: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
