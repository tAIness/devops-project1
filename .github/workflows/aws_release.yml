# yamllint disable rule:line-length rule:indentation
---
name: Release_AWS

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      runner:
        description: "Where to run jobs (ec2=self-hosted runner, github=github-hosted)"
        type: choice
        options: [ ec2, github ]
        default: ec2

permissions:
  contents: write
  packages: write
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ECR_REGISTRY: ${{ vars.AWS_ECR_REGISTRY }}
  AWS_ECR_REPO_APP: ${{ vars.AWS_ECR_REPO_APP }}
  AWS_ECR_REPO_WEB: ${{ vars.AWS_ECR_REPO_WEB }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-runner:
    name: Resolve runner (self-hosted vs github-hosted)
    runs-on: ubuntu-latest
    outputs:
      runs_on: ${{ steps.out.outputs.runs_on }}
      self_hosted: ${{ steps.out.outputs.self_hosted }}
    steps:
      - id: out
        shell: bash
        run: |
          set -euo pipefail
          in="${{ inputs.runner }}"
          var="${{ vars.RUNNER_TARGET }}"
          choice="${in:-${var:-ec2}}"

          if [[ "$choice" == "ec2" ]]; then
            echo 'runs_on=["self-hosted","ec2"]' >> "$GITHUB_OUTPUT"
            echo 'self_hosted=true' >> "$GITHUB_OUTPUT"
            echo "Runner resolved to: self-hosted/ec2"
          else
            echo 'runs_on=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
            echo 'self_hosted=false' >> "$GITHUB_OUTPUT"
            echo "Runner resolved to: github-hosted ubuntu-latest"
          fi

  compute-tag:
    name: Compute next tag (when pushing to main)
    needs: [resolve-runner]
    runs-on: ${{ fromJSON(needs.resolve-runner.outputs.runs_on) }}
    if: ${{ github.ref_type == 'branch' && github.ref_name == 'main' }}
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next tag (no create)
        id: bump
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          last="$(git tag -l 'v*.*.*' | sort -V | tail -n1 || true)"
          if [[ -z "$last" ]]; then
            major=1 minor=0 patch=1
          else
            IFS=. read -r vM vN vP <<<"${last#v}"
            major="$vM"; minor="$vN"; patch="$vP"
            patch=$((10#$patch + 1))
          fi
          echo "tag=v${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"

  setup:
    name: Resolve image tag
    needs: [resolve-runner, compute-tag]
    runs-on: ${{ fromJSON(needs.resolve-runner.outputs.runs_on) }}
    outputs:
      IMAGE_TAG: ${{ steps.resolve.outputs.IMAGE_TAG }}
    steps:
      - id: resolve
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "IMAGE_TAG=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "IMAGE_TAG=${{ needs.compute-tag.outputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

  bump-helm-appversion:
    name: Bump Helm appVersion in all charts & push
    needs: [resolve-runner, compute-tag]
    runs-on: ${{ fromJSON(needs.resolve-runner.outputs.runs_on) }}
    if: ${{ github.ref_type == 'branch' && github.ref_name == 'main' }}
    env:
      TAG: ${{ needs.compute-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install yq (static)
        shell: bash
        run: |
          set -euo pipefail
          YQ_VERSION=v4.44.3
          OS=$(uname); ARCH=$(uname -m)
          case "$ARCH" in
            x86_64) ARCH=amd64 ;;
            aarch64|arm64) ARCH=arm64 ;;
          esac
          curl -fsSL -o /usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_${OS}_${ARCH}"
          chmod +x /usr/local/bin/yq

      - name: Update appVersion for ALL charts + write releaseTag
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t charts < <(git ls-files 'infra/helm/**/Chart.yaml')
          (( ${#charts[@]} )) || { echo "No Chart.yaml under infra/helm"; exit 1; }
          for f in "${charts[@]}"; do
            yq -i '.appVersion = env(TAG)' "$f"
          done
          yq -i '.global.releaseTag = env(TAG)' infra/helm/argocd-apps/values.yaml

      - name: Commit & push change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name  "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes to commit."
          else
            git add infra/helm/**/Chart.yaml infra/helm/argocd-apps/values.yaml
            git commit -m "chore(helm): set appVersion & releaseTag ${TAG}"
            git push origin HEAD:main
          fi

  create-tag:
    name: Create & push git tag
    needs: [resolve-runner, compute-tag, bump-helm-appversion]
    runs-on: ${{ fromJSON(needs.resolve-runner.outputs.runs_on) }}
    if: ${{ github.ref_type == 'branch' && github.ref_name == 'main' }}
    env:
      TAG: ${{ needs.compute-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        shell: bash
        run: |
          git config user.name  "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

      - name: Tag & push
        shell: bash
        run: |
          set -euo pipefail
          git fetch --all --tags
          git checkout main
          git pull --ff-only
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; skipping create."
          else
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

  build-and-push-app:
    name: Build & push app image (ECR)
    needs: [resolve-runner, setup]
    runs-on: ${{ fromJSON(needs.resolve-runner.outputs.runs_on) }}
    env:
      IMAGE_TAG: ${{ needs.setup.outputs.IMAGE_TAG }}
    steps:
      - uses: actions/checkout@v4

      - name: Docker info (self-hosted sanity)
        shell: bash
        run: |
          docker --version
          docker compose version || true
          docker buildx version || true

      - name: Configure AWS credentials (OIDC role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR
        shell: bash
        run: |
          aws ecr get-login-password --region "${AWS_REGION}" \
            | docker login --username AWS --password-stdin "${AWS_ECR_REGISTRY}"

      - name: Decide build cache strategy (avoid gha-cache on self-hosted)
        id: cache
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ needs.resolve-runner.outputs.self_hosted }}" == "true" ]]; then
            mkdir -p /tmp/.buildx-cache
            echo "cache_from=type=local,src=/tmp/.buildx-cache" >> "$GITHUB_OUTPUT"
            echo "cache_to=type=local,dest=/tmp/.buildx-cache-new,mode=max" >> "$GITHUB_OUTPUT"
            echo "Using LOCAL cache (self-hosted)"
          else
            echo "cache_from=type=gha" >> "$GITHUB_OUTPUT"
            echo "cache_to=type=gha,mode=max" >> "$GITHUB_OUTPUT"
            echo "Using GHA cache (github-hosted)"
          fi

      - name: Build & push app to ECR
        uses: docker/build-push-action@v6
        with:
          context: ./app
          platforms: linux/amd64
          push: true
          tags: |
            ${{ vars.AWS_ECR_REGISTRY }}/${{ vars.AWS_ECR_REPO_APP }}:${{ needs.setup.outputs.IMAGE_TAG }}
            ${{ vars.AWS_ECR_REGISTRY }}/${{ vars.AWS_ECR_REPO_APP }}:latest
          cache-from: ${{ steps.cache.outputs.cache_from }}
          cache-to: ${{ steps.cache.outputs.cache_to }}

      - name: Finalize local cache (self-hosted only)
        if: ${{ needs.resolve-runner.outputs.self_hosted == 'true' }}
        shell: bash
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

  build-and-push-web:
    name: Build & push web image (ECR)
    needs: [resolve-runner, setup]
    runs-on: ${{ fromJSON(needs.resolve-runner.outputs.runs_on) }}
    env:
      IMAGE_TAG: ${{ needs.setup.outputs.IMAGE_TAG }}
    steps:
      - uses: actions/checkout@v4

      - name: Docker info (self-hosted sanity)
        shell: bash
        run: |
          docker --version
          docker compose version || true
          docker buildx version || true

      - name: Configure AWS credentials (OIDC role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR
        shell: bash
        run: |
          aws ecr get-login-password --region "${AWS_REGION}" \
            | docker login --username AWS --password-stdin "${AWS_ECR_REGISTRY}"

      - name: Decide build cache strategy (avoid gha-cache on self-hosted)
        id: cache
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ needs.resolve-runner.outputs.self_hosted }}" == "true" ]]; then
            mkdir -p /tmp/.buildx-cache
            echo "cache_from=type=local,src=/tmp/.buildx-cache" >> "$GITHUB_OUTPUT"
            echo "cache_to=type=local,dest=/tmp/.buildx-cache-new,mode=max" >> "$GITHUB_OUTPUT"
            echo "Using LOCAL cache (self-hosted)"
          else
            echo "cache_from=type=gha" >> "$GITHUB_OUTPUT"
            echo "cache_to=type=gha,mode=max" >> "$GITHUB_OUTPUT"
            echo "Using GHA cache (github-hosted)"
          fi

      - name: Build & push web to ECR
        uses: docker/build-push-action@v6
        with:
          context: ./web
          platforms: linux/amd64
          push: true
          tags: |
            ${{ vars.AWS_ECR_REGISTRY }}/${{ vars.AWS_ECR_REPO_WEB }}:${{ needs.setup.outputs.IMAGE_TAG }}
            ${{ vars.AWS_ECR_REGISTRY }}/${{ vars.AWS_ECR_REPO_WEB }}:latest
          cache-from: ${{ steps.cache.outputs.cache_from }}
          cache-to: ${{ steps.cache.outputs.cache_to }}

      - name: Finalize local cache (self-hosted only)
        if: ${{ needs.resolve-runner.outputs.self_hosted == 'true' }}
        shell: bash
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

  deploy-ec2:
    name: Deploy to EC2 (Docker Compose from ECR) — MUST be self-hosted
    needs: [resolve-runner, setup, build-and-push-app, build-and-push-web, create-tag]
    runs-on: ${{ fromJSON(needs.resolve-runner.outputs.runs_on) }}
    if: ${{ needs.resolve-runner.outputs.self_hosted == 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
    env:
      TAG: ${{ needs.setup.outputs.IMAGE_TAG }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ECR_REGISTRY: ${{ vars.AWS_ECR_REGISTRY }}
      APP_IMAGE: ${{ vars.AWS_ECR_REGISTRY }}/${{ vars.AWS_ECR_REPO_APP }}
      WEB_IMAGE: ${{ vars.AWS_ECR_REGISTRY }}/${{ vars.AWS_ECR_REPO_WEB }}
      DB_NAME: ${{ vars.DB_NAME }}
      DB_USER: ${{ vars.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_PORT: ${{ vars.DB_PORT || '5432' }}
      FLASK_PORT: ${{ vars.FLASK_PORT || '8000' }}
      WEB_PORT: ${{ vars.WEB_PORT || '8082' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to ECR
        shell: bash
        run: |
          aws ecr get-login-password --region "${AWS_REGION}" \
            | docker login --username AWS --password-stdin "${AWS_ECR_REGISTRY}"

      - name: Prepare /srv/supermario (.env + compose.yml)
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /srv/supermario
          sudo chown -R "$(id -u)":"$(id -g)" /srv/supermario

          cat > /srv/supermario/.env <<EOF
APP_IMAGE=${APP_IMAGE}
WEB_IMAGE=${WEB_IMAGE}
TAG=${TAG}
DB_NAME=${DB_NAME}
DB_USER=${DB_USER}
DB_PASSWORD=${DB_PASSWORD}
DB_PORT=${DB_PORT}
FLASK_PORT=${FLASK_PORT}
WEB_PORT=${WEB_PORT}
EOF

          cp -f deploy/compose.yml /srv/supermario/compose.yml
          echo "Wrote /srv/supermario/.env and /srv/supermario/compose.yml"

      - name: Deploy with Docker Compose
        shell: bash
        run: |
          set -euo pipefail
          cd /srv/supermario

          docker --version
          docker compose version

          docker pull "${APP_IMAGE}:${TAG}"
          docker pull "${WEB_IMAGE}:${TAG}"

          docker volume create supermario_db_data >/dev/null 2>&1 || true

          docker compose --env-file .env -f compose.yml up -d --no-build
          docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'

      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          echo "Testing API health on port ${FLASK_PORT}"
          curl -sf "http://127.0.0.1:${FLASK_PORT}/health" || (docker logs app || true; exit 1)

          echo "Testing WEB on port ${WEB_PORT}"
          curl -sI "http://127.0.0.1:${WEB_PORT}" | grep -q "200 OK"

  notify-slack:
    name: notify-slack / send
    if: ${{ always() }}
    needs:
      - setup
      - build-and-push-app
      - build-and-push-web
      - deploy-ec2
    uses: tAIness/devops-ci-lib/.github/workflows/slack-notify.yml@main
    secrets: inherit
    with:
      title: "Release_AWS: ${{ needs.setup.outputs.IMAGE_TAG || github.ref_name }}"
      status: ${{ (needs['build-and-push-app'].result == 'failure' || needs['build-and-push-web'].result == 'failure' || needs['deploy-ec2'].result == 'failure') && 'failure' || 'success' }}
      message: "runner=${{ inputs.runner || vars.RUNNER_TARGET || 'ec2' }} · tag=${{ needs.setup.outputs.IMAGE_TAG || github.ref_name }}"
      only_on: "always"
      run_url: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
