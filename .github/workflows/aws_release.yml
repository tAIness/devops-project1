# yamllint disable rule:line-length rule:indentation
---
name: Release_AWS

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      runner:
        description: "Where to run deploy (self-hosted runner labels). ec2=deploy on EC2 runner, kubernetes=k8s runner, mac=local mac runner"
        type: choice
        options: [ ec2, kubernetes, mac ]
        default: ec2

permissions:
  contents: write
  packages: write
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ECR_REGISTRY: ${{ vars.AWS_ECR_REGISTRY }}
  AWS_ECR_REPO_APP: ${{ vars.AWS_ECR_REPO_APP }}
  AWS_ECR_REPO_WEB: ${{ vars.AWS_ECR_REPO_WEB }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-runner:
    name: Resolve self-hosted runner labels
    runs-on: ubuntu-latest
    outputs:
      deploy_runner: ${{ steps.out.outputs.deploy_runner }}
    steps:
      - id: out
        shell: bash
        run: |
          set -euo pipefail
          # Priority: workflow input -> repo variable -> default
          in="${{ inputs.runner }}"
          var="${{ vars.RUNNER_TARGET }}"
          tgt="${in:-${var:-ec2}}"

          case "$tgt" in
            ec2)        labels='["self-hosted","ec2"]' ;;
            kubernetes) labels='["self-hosted","kubernetes"]' ;;
            mac)        labels='["self-hosted","macOS"]' ;;
            *)          labels='["self-hosted","ec2"]' ;;
          esac

          echo "deploy_runner=$labels" >> "$GITHUB_OUTPUT"
          echo "Resolved deploy runner: $labels"

  compute-tag:
    name: Compute next tag (when pushing to main)
    runs-on: ubuntu-latest
    if: ${{ github.ref_type == 'branch' && github.ref_name == 'main' }}
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next tag (no create)
        id: bump
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          last="$(git tag -l 'v*.*.*' | sort -V | tail -n1 || true)"
          if [[ -z "$last" ]]; then
            major=1 minor=0 patch=1
          else
            IFS=. read -r vM vN vP <<<"${last#v}"
            major="$vM"; minor="$vN"; patch="$vP"
            patch=$((10#$patch + 1))
          fi
          echo "tag=v${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"
          echo "Next tag: v${major}.${minor}.${patch}"

  setup:
    name: Resolve image tag
    runs-on: ubuntu-latest
    needs: [compute-tag]
    outputs:
      IMAGE_TAG: ${{ steps.resolve.outputs.IMAGE_TAG }}
    steps:
      - id: resolve
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "IMAGE_TAG=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "IMAGE_TAG=${{ needs.compute-tag.outputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

  bump-helm-appversion:
    name: Bump Helm appVersion in all charts & push
    runs-on: ubuntu-latest
    needs: [compute-tag]
    if: ${{ github.ref_type == 'branch' && github.ref_name == 'main' }}
    env:
      TAG: ${{ needs.compute-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install yq (static)
        run: |
          set -euo pipefail
          YQ_VERSION=v4.44.3
          OS=$(uname); ARCH=$(uname -m)
          case "$ARCH" in
            x86_64) ARCH=amd64 ;;
            aarch64|arm64) ARCH=arm64 ;;
          esac
          curl -fsSL -o /usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_${OS}_${ARCH}"
          chmod +x /usr/local/bin/yq

      - name: Update appVersion for ALL charts + write releaseTag
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t charts < <(git ls-files 'infra/helm/**/Chart.yaml')
          (( ${#charts[@]} )) || { echo "No Chart.yaml under infra/helm"; exit 1; }
          for f in "${charts[@]}"; do
            yq -i '.appVersion = env(TAG)' "$f"
          done
          yq -i '.global.releaseTag = env(TAG)' infra/helm/argocd-apps/values.yaml

      - name: Commit & push change
        run: |
          set -euo pipefail
          git config user.name  "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes to commit."
          else
            git add infra/helm/**/Chart.yaml infra/helm/argocd-apps/values.yaml
            git commit -m "chore(helm): set appVersion & releaseTag ${TAG}"
            git push origin HEAD:main
          fi

  create-tag:
    name: Create & push git tag
    runs-on: ubuntu-latest
    needs: [compute-tag, bump-helm-appversion]
    if: ${{ github.ref_type == 'branch' && github.ref_name == 'main' }}
    env:
      TAG: ${{ needs.compute-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name  "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

      - name: Tag & push
        shell: bash
        run: |
          set -euo pipefail
          git fetch --all --tags
          git checkout main
          git pull --ff-only
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; skipping create."
          else
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

  build-and-push-app:
    name: Build & push app image (ECR)
    runs-on: ubuntu-latest
    needs: [setup]
    env:
      IMAGE_TAG: ${{ needs.setup.outputs.IMAGE_TAG }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region "${AWS_REGION}" \
            | docker login --username AWS --password-stdin "${AWS_ECR_REGISTRY}"

      # IMPORTANT: disable gha cache to avoid the "<h2>Our services aren't available right now</h2>" cache endpoint failures
      - name: Build & push app to ECR (no GHA cache)
        uses: docker/build-push-action@v6
        with:
          context: ./app
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.AWS_ECR_REGISTRY }}/${{ env.AWS_ECR_REPO_APP }}:${{ env.IMAGE_TAG }}
            ${{ env.AWS_ECR_REGISTRY }}/${{ env.AWS_ECR_REPO_APP }}:latest
          cache-from: ""
          cache-to: ""

  build-and-push-web:
    name: Build & push web image (ECR)
    runs-on: ubuntu-latest
    needs: [setup]
    env:
      IMAGE_TAG: ${{ needs.setup.outputs.IMAGE_TAG }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region "${AWS_REGION}" \
            | docker login --username AWS --password-stdin "${AWS_ECR_REGISTRY}"

      - name: Build & push web to ECR (no GHA cache)
        uses: docker/build-push-action@v6
        with:
          context: ./web
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.AWS_ECR_REGISTRY }}/${{ env.AWS_ECR_REPO_WEB }}:${{ env.IMAGE_TAG }}
            ${{ env.AWS_ECR_REGISTRY }}/${{ env.AWS_ECR_REPO_WEB }}:latest
          cache-from: ""
          cache-to: ""

  deploy-ec2:
    name: Deploy to EC2 (Docker Compose from ECR) - SELF HOSTED
    needs: [resolve-runner, setup, build-and-push-app, build-and-push-web, create-tag]
    if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
    runs-on: ${{ fromJson(needs.resolve-runner.outputs.deploy_runner) }}
    env:
      TAG: ${{ needs.setup.outputs.IMAGE_TAG }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ECR_REGISTRY: ${{ vars.AWS_ECR_REGISTRY }}
      AWS_ECR_REPO_APP: ${{ vars.AWS_ECR_REPO_APP }}
      AWS_ECR_REPO_WEB: ${{ vars.AWS_ECR_REPO_WEB }}
      APP_IMAGE: ${{ vars.AWS_ECR_REGISTRY }}/${{ vars.AWS_ECR_REPO_APP }}
      WEB_IMAGE: ${{ vars.AWS_ECR_REGISTRY }}/${{ vars.AWS_ECR_REPO_WEB }}
      DB_NAME: ${{ vars.DB_NAME }}
      DB_USER: ${{ vars.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_PORT: ${{ vars.DB_PORT }}
      FLASK_PORT: ${{ vars.FLASK_PORT }}
      WEB_PORT: ${{ vars.WEB_PORT }}
    steps:
      - uses: actions/checkout@v4

      - name: Show runner identity
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner labels: ${{ needs.resolve-runner.outputs.deploy_runner }}"
          whoami || true
          uname -a || true
          docker version || true
          docker compose version || true

      - name: Configure AWS credentials (OIDC role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        shell: bash
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "${AWS_REGION}" \
            | docker login --username AWS --password-stdin "${AWS_ECR_REGISTRY}"

      - name: Write /srv/supermario/.env for compose
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /srv/supermario

          # Default ports if repo vars are empty
          DBP="${DB_PORT:-5432}"
          APIP="${FLASK_PORT:-8000}"
          WEBP="${WEB_PORT:-8082}"

          sudo tee /srv/supermario/.env >/dev/null <<EOF
          APP_IMAGE=${APP_IMAGE}
          WEB_IMAGE=${WEB_IMAGE}
          TAG=${TAG}
          DB_NAME=${DB_NAME}
          DB_USER=${DB_USER}
          DB_PASSWORD=${DB_PASSWORD}
          DB_PORT=${DBP}
          FLASK_PORT=${APIP}
          WEB_PORT=${WEBP}
          EOF

          sudo chmod 600 /srv/supermario/.env
          echo "Wrote /srv/supermario/.env"

      - name: Copy docker compose file to /srv/supermario
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /srv/supermario
          sudo cp -f deploy/compose.yml /srv/supermario/compose.yml

      - name: Deploy with docker compose
        shell: bash
        run: |
          set -euo pipefail
          cd /srv/supermario

          sudo docker pull "${APP_IMAGE}:${TAG}"
          sudo docker pull "${WEB_IMAGE}:${TAG}"

          sudo docker volume create supermario_db_data >/dev/null 2>&1 || true

          sudo docker compose --env-file .env -f compose.yml up -d --no-build
          sudo docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'

      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          APIP="${FLASK_PORT:-8000}"
          WEBP="${WEB_PORT:-8082}"
          curl -sf "http://127.0.0.1:${APIP}/health" >/dev/null
          curl -sI "http://127.0.0.1:${WEBP}" | grep -q "200 OK"
          echo "Smoke tests OK"

  slack-message:
    name: Build Slack message
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs:
      - resolve-runner
      - setup
      - build-and-push-app
      - build-and-push-web
      - deploy-ec2
    outputs:
      msg: ${{ steps.msg.outputs.msg }}
      status: ${{ steps.msg.outputs.status }}
    steps:
      - id: msg
        shell: bash
        run: |
          set -euo pipefail
          runner_json='${{ needs.resolve-runner.outputs.deploy_runner }}'
          tag='${{ needs.setup.outputs.IMAGE_TAG }}'
          bapp='${{ needs.build-and-push-app.result }}'
          bweb='${{ needs.build-and-push-web.result }}'
          dep='${{ needs.deploy-ec2.result }}'

          if [[ "$bapp" == "failure" || "$bweb" == "failure" || "$dep" == "failure" ]]; then
            st="failure"
          else
            st="success"
          fi

          echo "status=$st" >> "$GITHUB_OUTPUT"
          echo "msg=deploy_runner=${runner_json} · tag=${tag} · build_app=${bapp} · build_web=${bweb} · deploy=${dep}" >> "$GITHUB_OUTPUT"

  notify-slack:
    name: notify-slack / send
    if: ${{ always() }}
    needs:
      - setup
      - slack-message
    uses: tAIness/devops-ci-lib/.github/workflows/slack-notify.yml@main
    secrets: inherit
    with:
      title: "Release_AWS: ${{ needs.setup.outputs.IMAGE_TAG }}"
      status: ${{ needs.slack-message.outputs.status }}
      message: ${{ needs.slack-message.outputs.msg }}
      only_on: "always"
      run_url: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
